spring.application.name=painel-chamadas

# Carrega variáveis de um arquivo .env na raiz do projeto (se existir).
# Cada dev tem o seu próprio .env, local e fora do Git (ver .env.example).
spring.config.import=optional:file:.env[.properties]

#config postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/painel
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

#config hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true


# Porta da aplicação
server.port=1111