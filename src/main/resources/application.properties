spring.application.name=painel-chamadas

# Carrega variáveis de um arquivo .env na raiz do projeto (se existir).
# Cada dev tem o seu próprio .env, local e fora do Git (ver .env.example).
spring.config.import=optional:file:.env[.properties]

#config postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/painel
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

#config hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true


# Senha da tela de Indicadores (INDICADORES_SENHA no .env). Sem ela, só os indicadores ficam
# indisponíveis (503); o resto da API funciona normalmente.
indicadores.senha=${INDICADORES_SENHA:}

# Porta da aplicação
server.port=1111
# Erros com mensagem no corpo (ex.: 409 de etapa do paciente), para o front mostrar no toast.
server.error.include-message=always
