spring.config.import=optional:file:.env[.properties]

# Config PostgreSQL para testes de integracao
spring.datasource.url=jdbc:postgresql://localhost:5432/painel_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Config Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Inicializador automatico do banco de teste caso nao exista
context.initializer.classes=com.example.painel.config.TestDatabaseInitializer
