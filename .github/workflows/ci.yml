name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 4 classes de teste usam o banco painel_test num PostgreSQL em localhost:5432
    # (criado sozinho pelo TestDatabaseInitializer). As demais sobem o próprio banco
    # com Testcontainers, que usa o Docker do runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify
